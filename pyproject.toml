[project]
name = "photon"
version = "0.1.0"
description = "Het Jaar Rond: style guide and layout tool for the yearly photo book"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-cloud-firestore>=2.20",
    "google-cloud-storage>=2.19",  # data files and photos in the private bucket
    "google-auth>=2.38",
    "authlib>=1.4",
    "httpx>=0.28",  # authlib's starlette client imports it at runtime
    "itsdangerous>=2.2",
    "cryptography>=44.0",
    "anthropic>=2.6.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
]
# the local data pipeline (tools/, scripts/): never in the image
tools = [
    "pillow>=11.0",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photon"]

[tool.uv]
default-groups = ["dev", "tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/photon", "tests", "main.py", "dev.py", "deploy.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
